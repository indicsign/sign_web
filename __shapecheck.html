<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>shape key — standalone preview</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles/tokens.css">
<link rel="stylesheet" href="/src/styles/global.css">
<link rel="stylesheet" href="/src/styles/shapes.css">
<link rel="stylesheet" href="/src/sections/ShapeKey.css">
<style>
  body { padding: var(--space-5); }
  .bar { display:flex; gap:var(--space-3); align-items:center; margin-bottom:var(--space-4); }
  .bar button { border:1px solid var(--color-line); background:var(--color-raised);
    border-radius:var(--radius); padding:var(--space-2) var(--space-3); cursor:pointer;
    font-family:var(--font-display); font-weight:700; }
</style>
</head><body>
<div class="bar">
  <button id="replay" type="button">Replay the cascade</button>
  <span style="color:var(--color-ink-soft);font-size:var(--step--1)">
    Standalone preview of the same CSS the page uses. The real thing is at / — this is
    only for looking at the shapes in isolation.</span>
</div>
<div class="reveal" id="wrap">
  <div class="key__scroll" role="region" tabindex="0" aria-label="The nine containers">
    <table class="key"><thead><tr>
      <th class="key__head" scope="col">Sentence structure</th>
      <th class="key__head" scope="col">Shape</th>
      <th class="key__head" scope="col">Text colour</th>
      <th class="key__head" scope="col">Example</th>
    </tr></thead><tbody id="rows"></tbody></table>
  </div>
</div>
<script type="module">
const rows = [
 ['Subject','Who or what?','oval','who','Red','noun','',[['A','article'],['boy','noun']]],
 ['Object','Who or what?','rectangle',null,'Red','noun','',[['an','article'],['apple','noun']]],
 ['Verb','What doing?','hexagon',null,'Blue','verb','',[['eating','verb']]],
 ['Adjective phrase','What like, or how feeling?','cloud',null,'Green','adjective','',[['happy','adjective']]],
 ['Prepositional phrase','Where?','semicircle','where','Yellow','preposition','the preposition only',[['at','preposition'],['school',null]]],
 ['Time','When?','triangle',null,'Black','time','',[['today','time']]],
 ['Adverbs and means','How?','triangle-right',null,'Brown','adverb','the adverb only',[['quickly','adverb']]],
 ['Auxiliary verb','Is or are?','diamond',null,'Blue','verb','',[['is','verb']]],
 ['Second person','Who is being spoken to?','semicircle-down','who','Red','noun','',[['you','noun']]],
]
const names = {oval:'oval',rectangle:'rectangle',hexagon:'hexagon',cloud:'cloud',
  semicircle:'semi-circle',triangle:'triangle','triangle-right':'right-facing triangle',
  diamond:'diamond','semicircle-down':'upside-down semi-circle'}

document.getElementById('rows').innerHTML = rows.map(
  ([part,q,shape,slot,cname,crole,only,words]) => `
<tr class="key__row">
  <th class="key__cell key__cell--part" scope="row">
    <span class="key__part">${part}</span><span class="key__question">${q}</span></th>
  <td class="key__cell"><span class="coded__shape coded__shape--${shape}${slot?` coded__shape--${slot}`:''}">
    <span class="visually-hidden">${names[shape]}</span></span></td>
  <td class="key__cell"><span class="key__colour">
    <span class="key__swatch key__swatch--${crole}" aria-hidden="true"></span>
    <span><span class="key__colour-name">${cname}</span>${only?`<span class="key__colour-only">${only}</span>`:''}</span>
  </span></td>
  <td class="key__cell"><span class="key__example">${
    words.map(([t,r])=>`<span class="coded__word${r?` coded__word--${r}`:''}">${t}</span>`).join('')
  }</span></td>
</tr>`).join('')

const wrap = document.getElementById('wrap')
const play = () => {
  wrap.classList.remove('reveal--in')
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('reveal--in')))
}
document.getElementById('replay').addEventListener('click', play)
play()
</script>
</body></html>
