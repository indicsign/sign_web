name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `npm run build` typechecks before it bundles, so tsc runs here too.
      #
      # The build refuses to run without VITE_SUBPAGE rather than emitting a page
      # whose calls to action go nowhere. This job only ever validates — it never
      # deploys — so a missing secret falls back to an address that cannot resolve.
      # A pull request from a fork gets no secrets at all, and still has to be able
      # to compile. The publish job below is where the real value is mandatory.
      - run: npm run build
        env:
          VITE_SUBPAGE: ${{ secrets.VITE_SUBPAGE || 'https://vite-subpage-not-configured.invalid/' }}
      # Built for inspection, not for deployment: if the secret was absent, every
      # call to action in this artifact points at the placeholder above.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: indicai-landing:${{ github.sha }}
          # Same fallback as above, for the same reason. On a push to main the secret
          # is present, so this builds the identical layers publish then reuses; only
          # a fork's pull request gets the placeholder, and a fork never publishes.
          build-args: |
            VITE_SUBPAGE=${{ secrets.VITE_SUBPAGE || 'https://vite-subpage-not-configured.invalid/' }}
          # Publish pulls these layers back out of the cache, so the image is
          # only ever built once per commit, and it is built before the
          # production environment's protection rules can hold the push.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, image]
    runs-on: ubuntu-latest
    # Holds the Docker Hub credentials; any protection rules configured on the
    # environment gate this job before it can push.
    environment: production
    steps:
      - uses: actions/checkout@v4
      # No fallback here. Publishing an image whose every call to action points at an
      # unreachable placeholder is worse than not publishing, and the page gives no
      # sign anything is wrong — Button renders a dead control rather than an error.
      - name: Require the real CTA URL
        env:
          VITE_SUBPAGE: ${{ secrets.VITE_SUBPAGE }}
        run: |
          if [ -z "$VITE_SUBPAGE" ]; then
            echo "::error::VITE_SUBPAGE is not set. Add it under Settings -> Secrets and variables -> Actions, then re-run."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_SUBPAGE=${{ secrets.VITE_SUBPAGE }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/indicai-landing:latest
            ${{ secrets.DOCKER_USERNAME }}/indicai-landing:${{ github.sha }}
          cache-from: type=gha
