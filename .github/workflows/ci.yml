name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `npm run build` typechecks before it bundles, so tsc runs here too.
      # VITE_SUBPAGE is required: the build refuses to run without it rather than
      # emitting a page whose calls to action go nowhere.
      - run: npm run build
        env:
          VITE_SUBPAGE: ${{ secrets.VITE_SUBPAGE }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: indicai-landing:${{ github.sha }}
          build-args: |
            VITE_SUBPAGE=${{ secrets.VITE_SUBPAGE }}
          # Publish pulls these layers back out of the cache, so the image is
          # only ever built once per commit, and it is built before the
          # production environment's protection rules can hold the push.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, image]
    runs-on: ubuntu-latest
    # Holds the Docker Hub credentials; any protection rules configured on the
    # environment gate this job before it can push.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_SUBPAGE=${{ secrets.VITE_SUBPAGE }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/indicai-landing:latest
            ${{ secrets.DOCKER_USERNAME }}/indicai-landing:${{ github.sha }}
          cache-from: type=gha
