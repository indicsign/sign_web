server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = / {
    return 302 /full/indicai/;
  }

  location /full/indicai/ {
    try_files $uri $uri/ /full/indicai/index.html;
  }

  # Vite fingerprints these filenames, so they can be cached for as long as
  # a browser is willing to keep them.
  location /full/indicai/assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /full/indicai/index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;
}
