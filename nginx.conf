# Processed by the nginx image's envsubst entrypoint (it is copied to
# /etc/nginx/templates/default.conf.template), so ${PORT} is filled in at
# container start. Railway assigns the port it routes to and reaches the
# container over IPv6, so neither the port nor the address family can be
# hardcoded here.
server {
  listen ${PORT} default_server;
  listen [::]:${PORT} default_server;
  server_name _;
  root /usr/share/nginx/html;

  # Railway's healthcheck needs a 200.
  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite fingerprints these filenames, so they can be cached for as long as
  # a browser is willing to keep them.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;
}
